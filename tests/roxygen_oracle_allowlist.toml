# roxygen2 oracle allowlist (see tests/roxygen_oracle.rs).
#
# Records deliberate, defensible divergences where roxygen2 renders DIFFERENT Rd
# from arity's formatted output than from the original --- i.e. arity's formatting
# is intentionally not Rd-preserving for that case. Each entry is one line:
#
#   key = "reason"
#
# where `key` is the corpus file stem (default corpus) or the corpus-relative
# path (custom `ROXYGEN_ORACLE_CORPUS`). Hand-parsed as a tiny TOML subset (no
# dev-dependency); `#` comments and a `[section]` header line are ignored.
#
# An entry here is the "tension": diverging from what roxygen2 renders should be a
# conscious, documented decision, never silent. Prefer fixing the formatter
# (Adopt) over recording a divergence (Record) unless the change is genuinely
# intended and harmless.

[divergences]
# (none yet)
