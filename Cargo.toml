[package]
name = "ravel"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "An LSP, formatter, and linter for R"
license = "MIT"
repository = "https://github.com/jolars/ravel"
# homepage = "https://jolars.github.io/ravel"
authors = ["Johan Larsson <johan@jolars.co>"]
keywords = ["r", "language-server", "formatter", "linter"]
categories = [
  "command-line-utilities",
  "text-processing",
  "parsing",
  "parser-implementations",
]

[dependencies]
annotate-snippets = "0.11.5"
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5"
env_logger = "0.11.10"
flate2 = "1.0"
globset = "0.4.18"
ignore = "0.4.26"
log = { version = "0.4.29", features = ["release_max_level_info"] }
lsp-server = "0.7"
lsp-types = "0.97"
rayon = "1.12.0"
regex = "1.11"
rowan = "0.16.1"
salsa = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smol_str = { version = "0.3.2", features = ["serde"] }
tempfile = "3.27.0"
toml = "1.1.2"
uuid = { version = "1.23.2", features = ["v4"] }

[dev-dependencies]
insta = "1.47.2"
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "4cbd36d552e27d8930cff1602d56bfd9ce4c1ed1" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap-markdown = "0.1.5"
clap_complete = "4.6.5"
clap_mangen = "0.3.0"
