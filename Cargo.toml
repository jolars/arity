[package]
name = "arity"
version = "0.13.0"
edition = "2024"
rust-version = "1.88"
readme = "README.md"
description = "A language server, formatter, and linter for R"
license = "MIT"
repository = "https://github.com/jolars/arity"
homepage = "https://arity.cc"
documentation = "https://arity.cc"
authors = ["Johan Larsson <johan@jolars.co>"]
include = ["/src/**/*", "/build.rs", "/README.md", "/LICENSE"]
keywords = ["r", "language-server", "formatter", "linter"]
categories = [
  "command-line-utilities",
  "text-processing",
  "parsing",
  "parser-implementations",
]

[lib]
name = "arity"

[[bin]]
name = "arity"
path = "src/main.rs"

[dependencies]
annotate-snippets = "0.12.16"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
crossbeam-channel = "0.5"
env_logger = "0.11.10"
flate2 = "1.0"
globset = "0.4.18"
ignore = "0.4.26"
log = { version = "0.4.32", features = ["release_max_level_info"] }
lsp-server = "0.10"
lsp-types = "0.97"
mimalloc = "0.1.52"
rayon = "1.12.0"
regex = "1.11"
rowan = "0.16.1"
salsa = "0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
similar = { version = "3.1.1", features = ["text"] }
smol_str = { version = "0.3.2", features = ["serde"] }
tempfile = "3.27.0"
toml = "1.1.2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
insta = "1.47.2"
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "4cbd36d552e27d8930cff1602d56bfd9ce4c1ed1" }
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "parse"
harness = false

[build-dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clapdown = "0.1.0"
clap_complete = "4.6.5"
clap_mangen = "0.3.0"
