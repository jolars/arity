version: "3"

tasks:
  lint:
    desc: Run linter
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  format:
    desc: Check code formatting
    cmds:
      - cargo fmt --

  build-release:
    desc: Build release version
    cmds:
      - cargo build --release

  test:
    desc: Run tests
    cmds:
      - cargo test

  test-debug:
    desc: Run tests with debug logging
    cmds:
      - RUST_LOG=debug cargo test

  test-trace:
    desc: Run tests with trace logging for parser
    cmds:
      - RUST_LOG=panache::parser=trace cargo test

  test-quiet:
    desc: Run tests quietly (no debug output)
    cmds:
      - RUST_LOG=off cargo test

  air-compat:
    desc: Measure soft air-formatter compatibility (writes AIR_COMPAT.md)
    cmds:
      - cargo test --test air_compat -- --ignored --nocapture

  bench:
    desc: Benchmark formatter speed vs. air on large files (writes BENCH.md)
    cmds:
      - ./scripts/bench-format.sh

  bench-parse:
    desc: Benchmark parse + incremental-reparse speed (criterion)
    cmds:
      - cargo bench --bench parse

  docs-preview:
    desc: Preview documentation site locally
    cmds:
      - cd docs && quarto preview --no-browser

  audit:
    desc: Run security audit
    cmds:
      - cargo audit

  deny:
    desc: Run cargo deny to check for vulnerabilities and issues
    cmds:
      - cargo deny check

  logo:
    desc: Regenerate the generative logo from scripts/logo.R
    sources:
      - scripts/logo.R
    generates:
      - images/logo-generated.svg
    cmds:
      - Rscript scripts/logo.R

  logo-watch:
    desc: Watch scripts/logo.R and regenerate the logo on changes
    watch: true
    sources:
      - scripts/logo.R
    cmds:
      - Rscript scripts/logo.R
