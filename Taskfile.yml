version: "3"

tasks:
  lint:
    desc: Run linter
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  format:
    desc: Check code formatting
    cmds:
      - cargo fmt --all --

  build-release:
    desc: Build release version
    cmds:
      - cargo build --release

  test:
    desc: Run tests
    cmds:
      - cargo test --workspace

  test-debug:
    desc: Run tests with debug logging
    cmds:
      - RUST_LOG=debug cargo test --workspace

  test-quiet:
    desc: Run tests quietly (no debug output)
    cmds:
      - RUST_LOG=off cargo test --workspace

  air-compat:
    desc: Measure soft air-formatter compatibility (writes AIR_COMPAT.md)
    cmds:
      - cargo test -p arity-formatter --test air_compat -- --ignored --nocapture

  corpus:
    desc: Tier 0 corpus smoke test (losslessness + idempotence; set ARITY_CORPUS)
    cmds:
      - cargo test --test corpus -- --ignored --nocapture

  roxygen-projector:
    desc: Projector-parity gate -- CST->Rd sections vs pinned .rdtree (writes ROXYGEN_PROJECTOR.md; pure Rust, no R, the CI-safe conformance gate)
    cmds:
      - cargo test --test roxygen_projector -- --nocapture

  roxygen-projector-refresh:
    desc: Re-mint ALL projector section pins from roxygen2 -- curated .rdtree + harvested roxygen-sections.jsonl (needs R + roxygen2; run after a deliberate parser change)
    cmds:
      - |
        for r in tests/oracle/corpus/roxygen/*.R; do
          pin="${r%.R}.rdtree"
          Rscript tests/oracle/roxygen_oracle.R block-to-sections < "$r" > "$pin" \
            && echo "minted $pin" || echo "SKIP $r (roxygen2 could not process)"
        done
      - task: roxygen-projector-pins
      - task: roxygen-spec-pins

  roxygen-projector-pins:
    desc: Mint the harvested corpus's projector-eligible section pins (tests/oracle/corpus/roxygen-sections.jsonl; needs R + roxygen2)
    cmds:
      - |
        Rscript tests/oracle/roxygen_oracle.R projector-pins \
          < tests/oracle/corpus/roxygen.jsonl > tests/oracle/corpus/roxygen-sections.jsonl
        echo "minted $(wc -l < tests/oracle/corpus/roxygen-sections.jsonl) eligible pins of $(grep -vc '^$' tests/oracle/corpus/roxygen.jsonl) harvested"

  roxygen-spec-corpus:
    desc: Rebuild the CommonMark spec @md corpus + pins from the vendored spec.txt (the WHOLE spec; needs R + roxygen2). Run after re-vendoring spec.txt.
    cmds:
      - |
        Rscript scripts/build-commonmark-corpus.R tests/oracle/corpus/commonmark-spec/spec.txt \
          ALL tests/oracle/corpus/commonmark-spec.jsonl
      - task: roxygen-spec-pins

  roxygen-spec-pins:
    desc: Mint the CommonMark spec corpus's section pins (commonmark-spec-sections.jsonl; needs R + roxygen2)
    cmds:
      - |
        Rscript tests/oracle/roxygen_oracle.R projector-pins \
          < tests/oracle/corpus/commonmark-spec.jsonl > tests/oracle/corpus/commonmark-spec-sections.jsonl
        echo "minted $(wc -l < tests/oracle/corpus/commonmark-spec-sections.jsonl) spec pins"

  roxygen-projector-seed:
    desc: Re-seed the projector allowlist from currently-matching cases (pure Rust, no R; preserves the header)
    cmds:
      - |
        cargo test --test roxygen_projector -- --nocapture 2>/dev/null \
          | grep '^PASS ' | awk '{print $2}' | sort > /tmp/roxygen-projector-pass.txt
        { grep -E '^#|^$' tests/oracle/roxygen-projector-allowlist.txt; cat /tmp/roxygen-projector-pass.txt; } \
          > /tmp/roxygen-projector-allowlist.txt \
          && mv /tmp/roxygen-projector-allowlist.txt tests/oracle/roxygen-projector-allowlist.txt
        echo "seeded $(wc -l < /tmp/roxygen-projector-pass.txt) matching cases into the projector allowlist"

  dcf-oracle:
    desc: Check the DCF parser and formatter against R's own `read.dcf` (needs R)
    cmds:
      - cargo test --test dcf_oracle -- --ignored --nocapture

  desc-compat:
    desc: Measure DESCRIPTION formatting against `desc` (soft gauge, needs R + desc)
    cmds:
      - cargo test --test desc_compat -- --ignored --nocapture

  deps-oracle:
    desc: Check the dependency-exemption sets against `R CMD check`'s own (needs R)
    cmds:
      - cargo test --test deps_oracle -- --ignored --nocapture

  description-oracle:
    desc: Check the DESCRIPTION rules against `R CMD check`'s own, and report the signals no rule covers yet (needs R)
    cmds:
      - cargo test --test description_oracle -- --ignored --nocapture

  roxygen-oracle:
    desc: Measure roxygen2 Rd-preservation fixed point on the curated corpus (writes ROXYGEN_ORACLE.md; needs R + roxygen2)
    cmds:
      - cargo test --test roxygen_oracle -- --ignored --nocapture roxygen_oracle_report

  roxygen-harvest:
    desc: Triage the harvested roxygen corpus + guard the allowlist (writes ROXYGEN_HARVEST.md; needs R + roxygen2)
    cmds:
      - cargo test --test roxygen_oracle -- --ignored --nocapture roxygen_harvested

  roxygen-harvest-seed:
    desc: Re-seed the harvested-corpus allowlist from current PASS slugs (needs R + roxygen2)
    cmds:
      - |
        cargo test --test roxygen_oracle -- --ignored --nocapture roxygen_harvested_report 2>/dev/null \
          | grep '^PASS ' | awk '{print $2}' | sort > /tmp/roxygen-pass.txt
        { grep -E '^#|^$' tests/oracle/roxygen-allowlist.txt; cat /tmp/roxygen-pass.txt; } \
          > /tmp/roxygen-allowlist.txt && mv /tmp/roxygen-allowlist.txt tests/oracle/roxygen-allowlist.txt
        echo "seeded $(wc -l < /tmp/roxygen-pass.txt) PASS slugs into the allowlist"

  roxygen-lint-oracle:
    desc: Compare the documentation lint rules against roxygen2's own warnings (writes ROXYGEN_LINT.md; needs R + roxygen2)
    cmds:
      - cargo test --test roxygen_lint_oracle -- --ignored --nocapture roxygen_lint_oracle_report

  roxygen-lint-oracle-seed:
    desc: Re-seed the lint-oracle allowlist from currently matching files (needs R + roxygen2)
    cmds:
      - |
        cargo test --test roxygen_lint_oracle -- --ignored --nocapture roxygen_lint_oracle_report 2>/dev/null \
          | grep '^PASS ' | awk '{print $2}' | sort > /tmp/roxygen-lint-pass.txt
        { grep -E '^#|^$' tests/oracle/roxygen-lint-allowlist.txt; cat /tmp/roxygen-lint-pass.txt; } \
          > /tmp/roxygen-lint-allowlist.txt && mv /tmp/roxygen-lint-allowlist.txt tests/oracle/roxygen-lint-allowlist.txt
        echo "seeded $(wc -l < /tmp/roxygen-lint-pass.txt) matching files into the lint-oracle allowlist"

  bench:
    desc: Benchmark formatter (vs air/styler) and linter (vs jarl/lintr) speed on files + real projects (writes benches/benchmark_results.json; run docgen to refresh the docs page)
    cmds:
      - ./scripts/bench.sh

  profile:
    desc: 'Profile one phase with perf and print a phase split (opt-in, local; e.g. task profile -- --mode lint --path pkg/R)'
    cmds:
      - ./scripts/profile.sh {{.CLI_ARGS}}

  bench-parse:
    desc: Benchmark parse + incremental-reparse speed (criterion)
    cmds:
      - cargo bench -p arity-parser --bench parse

  bench-line-index:
    desc: Benchmark line-index build, patch, and conversion speed (criterion)
    cmds:
      - cargo bench --bench line_index

  bench-format-edits:
    desc: Measure what line-scoped LSP formatting edits cost and what they save
    cmds:
      - cargo bench --bench format_edits

  docs-gen:
    desc: Regenerate generated mdBook pages (CLI reference + rule docs)
    cmds:
      - cargo run --example docgen

  docs-preview:
    desc: Regenerate generated pages and serve the mdBook locally
    deps:
      - docs-gen
    cmds:
      - mdbook serve docs --open

  docs-build:
    desc: Regenerate generated pages and build the mdBook
    deps:
      - docs-gen
    cmds:
      - mdbook build docs
      - task: docs-canonical
      - task: docs-sitemap

  docs-canonical:
    desc: Inject <link rel="canonical"> into each rendered page
    cmds:
      - >-
        cargo run --quiet --example canonical --
        docs/book https://arity.cc/

  docs-sitemap:
    desc: Generate docs/book/sitemap.xml from the rendered book
    cmds:
      - >-
        cargo run --quiet --example sitemap --
        docs/book https://arity.cc/

  docs-lighthouse:
    desc: Run a Lighthouse desktop audit on the built docs (perf, a11y, best-practices, SEO)
    deps:
      - docs-build
    vars:
      PORT: '{{.PORT | default "8347"}}'
    cmds:
      - mkdir -p .lighthouse
      - >-
        python3 -m http.server {{.PORT}} --directory docs/book
        >/dev/null 2>&1 &
        SERVER_PID=$!;
        trap "kill $SERVER_PID 2>/dev/null" EXIT;
        until curl -sf -o /dev/null "http://localhost:{{.PORT}}/index.html"; do sleep 0.2; done;
        CHROME_PATH="$(command -v chromium)"
        lighthouse "http://localhost:{{.PORT}}/index.html"
        --preset=desktop
        --output=json --output=html
        --output-path=.lighthouse/report
        --chrome-flags="--headless=new --no-sandbox --disable-gpu"
        --only-categories=performance,accessibility,best-practices,seo
        --quiet
      - >-
        node -e 'const r=require("./.lighthouse/report.report.json");
        for(const k in r.categories)
        console.log(r.categories[k].title.padEnd(16),
        Math.round(r.categories[k].score*100));'

  audit:
    desc: Run security audit
    cmds:
      - cargo audit

  deny:
    desc: Run cargo deny to check for vulnerabilities and issues
    cmds:
      - cargo deny check
