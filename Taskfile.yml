version: "3"

tasks:
  lint:
    desc: Run linter
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  format:
    desc: Check code formatting
    cmds:
      - cargo fmt --

  build-release:
    desc: Build release version
    cmds:
      - cargo build --release

  test:
    desc: Run tests
    cmds:
      - cargo test

  test-debug:
    desc: Run tests with debug logging
    cmds:
      - RUST_LOG=debug cargo test

  test-trace:
    desc: Run tests with trace logging for parser
    cmds:
      - RUST_LOG=panache::parser=trace cargo test

  test-quiet:
    desc: Run tests quietly (no debug output)
    cmds:
      - RUST_LOG=off cargo test

  air-compat:
    desc: Measure soft air-formatter compatibility (writes AIR_COMPAT.md)
    cmds:
      - cargo test --test air_compat -- --ignored --nocapture

  corpus:
    desc: Tier 0 corpus smoke test (losslessness + idempotence; set ARITY_CORPUS)
    cmds:
      - cargo test --test corpus -- --ignored --nocapture

  roxygen-projector:
    desc: Projector-parity gate -- CST->Rd sections vs pinned .rdtree (writes ROXYGEN_PROJECTOR.md; pure Rust, no R, the CI-safe conformance gate)
    cmds:
      - cargo test --test roxygen_projector -- --nocapture

  roxygen-projector-refresh:
    desc: Re-mint ALL projector section pins from roxygen2 -- curated .rdtree + harvested roxygen-sections.jsonl (needs R + roxygen2; run after a deliberate parser change)
    cmds:
      - |
        for r in tests/oracle/corpus/roxygen/*.R; do
          pin="${r%.R}.rdtree"
          Rscript tests/oracle/roxygen_oracle.R block-to-sections < "$r" > "$pin" \
            && echo "minted $pin" || echo "SKIP $r (roxygen2 could not process)"
        done
      - task: roxygen-projector-pins

  roxygen-projector-pins:
    desc: Mint the harvested corpus's projector-eligible section pins (tests/oracle/corpus/roxygen-sections.jsonl; needs R + roxygen2)
    cmds:
      - |
        Rscript tests/oracle/roxygen_oracle.R projector-pins \
          < tests/oracle/corpus/roxygen.jsonl > tests/oracle/corpus/roxygen-sections.jsonl
        echo "minted $(wc -l < tests/oracle/corpus/roxygen-sections.jsonl) eligible pins of $(grep -vc '^$' tests/oracle/corpus/roxygen.jsonl) harvested"

  roxygen-projector-seed:
    desc: Re-seed the projector allowlist from currently-matching cases (pure Rust, no R; preserves the header)
    cmds:
      - |
        cargo test --test roxygen_projector -- --nocapture 2>/dev/null \
          | grep '^PASS ' | awk '{print $2}' | sort > /tmp/roxygen-projector-pass.txt
        { grep -E '^#|^$' tests/oracle/roxygen-projector-allowlist.txt; cat /tmp/roxygen-projector-pass.txt; } \
          > /tmp/roxygen-projector-allowlist.txt \
          && mv /tmp/roxygen-projector-allowlist.txt tests/oracle/roxygen-projector-allowlist.txt
        echo "seeded $(wc -l < /tmp/roxygen-projector-pass.txt) matching cases into the projector allowlist"

  roxygen-oracle:
    desc: Measure roxygen2 Rd-preservation fixed point on the curated corpus (writes ROXYGEN_ORACLE.md; needs R + roxygen2)
    cmds:
      - cargo test --test roxygen_oracle -- --ignored --nocapture roxygen_oracle_report

  roxygen-harvest:
    desc: Triage the harvested roxygen corpus + guard the allowlist (writes ROXYGEN_HARVEST.md; needs R + roxygen2)
    cmds:
      - cargo test --test roxygen_oracle -- --ignored --nocapture roxygen_harvested

  roxygen-harvest-seed:
    desc: Re-seed the harvested-corpus allowlist from current PASS slugs (needs R + roxygen2)
    cmds:
      - |
        cargo test --test roxygen_oracle -- --ignored --nocapture roxygen_harvested_report 2>/dev/null \
          | grep '^PASS ' | awk '{print $2}' | sort > /tmp/roxygen-pass.txt
        { grep -E '^#|^$' tests/oracle/roxygen-allowlist.txt; cat /tmp/roxygen-pass.txt; } \
          > /tmp/roxygen-allowlist.txt && mv /tmp/roxygen-allowlist.txt tests/oracle/roxygen-allowlist.txt
        echo "seeded $(wc -l < /tmp/roxygen-pass.txt) PASS slugs into the allowlist"

  bench:
    desc: Benchmark formatter speed vs. air on large files (writes BENCH.md)
    cmds:
      - ./scripts/bench-format.sh

  bench-parse:
    desc: Benchmark parse + incremental-reparse speed (criterion)
    cmds:
      - cargo bench --bench parse

  docs-gen:
    desc: Regenerate generated mdBook pages (CLI reference + rule docs)
    cmds:
      - cargo run --example docgen

  docs-preview:
    desc: Regenerate generated pages and serve the mdBook locally
    deps:
      - docs-gen
    cmds:
      - mdbook serve book --open

  docs-build:
    desc: Regenerate generated pages and build the mdBook
    deps:
      - docs-gen
    cmds:
      - mdbook build book
      - task: docs-sitemap

  docs-sitemap:
    desc: Generate book/book/sitemap.xml from the rendered book
    cmds:
      - >-
        cargo run --quiet --example sitemap --
        book/book https://arity.cc/

  audit:
    desc: Run security audit
    cmds:
      - cargo audit

  deny:
    desc: Run cargo deny to check for vulnerabilities and issues
    cmds:
      - cargo deny check
