name: Documentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "src/**"
      - "crates/**"
      - "examples/docgen.rs"
      - "build.rs"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "Taskfile.yml"
      - "benches/*results.json"
      - "arity.schema.json"
      - "scripts/arity-installer.*"
      - ".github/workflows/docs.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Check Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Page modification dates and sitemap entries use Git history.
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm --prefix docs ci
      - name: Generate reference pages
        run: cargo run --example docgen
      - name: Build VitePress and Markdown variants
        run: npm --prefix docs run build
      - name: Check links, legacy URLs, downloads, and Worker responses
        run: npm --prefix docs run check
      - name: Check dependencies
        run: npm --prefix docs audit
      - name: Check Worker deployment
        run: npm --prefix docs run deploy:check
      - name: Upload checked site
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/.vitepress/dist
          include-hidden-files: true

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: docs-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://arity.cc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm --prefix docs ci
      - name: Download checked site
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: docs/.vitepress/dist
      - name: Deploy site
        run: npm --prefix docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public responses
        run: |
          curl --fail --retry 5 --retry-all-errors https://arity.cc/ -o /tmp/arity-home.html
          grep -q 'VPHero' /tmp/arity-home.html
          curl --fail https://arity.cc/guide/editors.html -o /dev/null
          curl --fail -H 'Accept: text/markdown' https://arity.cc/ -o /tmp/arity-home.md
          grep -q '^# Arity' /tmp/arity-home.md
          curl --fail https://arity.cc/install -o /tmp/arity-install
          cmp scripts/arity-installer.sh /tmp/arity-install
          curl --fail https://arity.cc/arity.schema.json -o /tmp/arity-schema.json
          cmp arity.schema.json /tmp/arity-schema.json
          test "$(curl -s -o /dev/null -w '%{http_code}' https://arity.cc/no-such-page.html)" = 404

  lighthouse:
    name: Lighthouse Audit
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit URLs using Lighthouse
        run: npx unlighthouse-ci --site https://arity.cc --build-static
