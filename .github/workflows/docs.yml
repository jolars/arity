name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

# Serialize all Documentation runs into a single Pages deployment. A release
# pushes the release commit to `main` and the `v*` tag near-simultaneously;
# keying on `github.ref` would put them in separate groups and let both race
# the single `github-pages` environment ("Deployment failed, try again later").
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the sitemap can derive per-page <lastmod> from git.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Generate reference pages
        run: cargo run --example docgen

      - name: Build mdBook
        run: mdbook build docs

      # mdBook has no `canonical-site-url` setting (rust-lang/mdBook#2706), so
      # inject a <link rel="canonical"> into every rendered page post-build.
      - name: Inject canonical links
        run: cargo run --quiet --example canonical -- docs/book https://arity.cc/

      # mdBook has no built-in sitemap; generate one from the rendered pages.
      # `lastmod` is derived from git history, so this needs full history.
      - name: Generate sitemap
        run: cargo run --quiet --example sitemap -- docs/book https://arity.cc/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  lighthouse:
    name: Lighthouse Audit
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit URLs using Lighthouse
        run: npx unlighthouse-ci --site https://arity.cc --build-static
