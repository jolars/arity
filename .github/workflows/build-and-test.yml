name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

  msrv:
    if: github.event_name != 'schedule'
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Run tests
        run: cargo test --workspace --locked --verbose

  wasm:
    if: github.event_name != 'schedule'
    name: Wasm Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # `arity-formatter` is embedded by the dprint Wasm plugin
      # (github.com/jolars/dprint-plugin-arity), which builds only for
      # wasm32-unknown-unknown. Nothing else in the workspace targets wasm, so
      # this job is the only thing keeping the member crates free of
      # filesystem/thread/time dependencies.
      - name: Build arity-formatter for wasm
        run: >
          cargo build -p arity-formatter --release
          --target wasm32-unknown-unknown --features schema

  zed:
    name: Zed Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editors/zed
          key: zed
      # `editors/zed` is its own workspace (a `wasm32-wasip2` cdylib on edition
      # 2021), so none of the workspace-wide jobs above reach it. Without this
      # job the extension would only ever be compiled by Zed's registry, long
      # after the change that broke it landed.
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: editors/zed
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: editors/zed
      - name: Test
        run: cargo test --locked
        working-directory: editors/zed
      # `--locked` is also what catches a `Cargo.lock` left behind by a version
      # bump, since nothing else regenerates it.
      - name: Build for wasm
        run: cargo build --release --target wasm32-wasip2 --locked
        working-directory: editors/zed

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  versionary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, msrv, wasm, zed, cargo-audit, cargo-deny]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.versionary.outputs.release_created }}
      tag_name: ${{ steps.versionary.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - id: versionary
        uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  build-release-assets:
    name: Build & Upload Release Assets
    needs: versionary
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/packages.yml
    with:
      upload: "true"
      tag: ${{ needs.versionary.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write # mint the OIDC token for keyless provenance signing
      attestations: write # store the build provenance attestation

  publish-extensions:
    name: Publish Editor Extensions
    needs: [versionary, build-release-assets]
    if: ${{ needs.versionary.outputs.release_created == 'true' && startsWith(needs.versionary.outputs.tag_name, 'v') }}
    uses: ./.github/workflows/publish-code-extensions.yml
    with:
      release-tag: ${{ needs.versionary.outputs.tag_name }}
    secrets: inherit
