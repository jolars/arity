name: Smoke Test

# Weekly Tier 0 corpus smoke test: clone a set of real R package repos, format
# every .R file with arity, and assert losslessness + idempotence on each (the
# `corpus` integration test). Regressions are filed as deduped GitHub issues.
#
# It does NOT check semantic preservation (that formatted code means the same);
# that needs a trivia-stripped AST comparison and is deferred.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: "0 4 * * 1"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus-scan:
    name: Scan R Package Corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      failure_count: ${{ steps.summarize.outputs.failure_count }}
    env:
      # One `owner/repo` per line. Shallow-cloned at HEAD; the resolved SHA is
      # recorded per failure for reproduction.
      TARGET_REPOS: |
        tidyverse/dplyr
        tidyverse/ggplot2
        tidyverse/tidyr
        tidyverse/purrr
        tidyverse/stringr
        r-lib/rlang
        r-lib/cli
        r-lib/vctrs
        r-lib/withr
        r-lib/scales
        wch/r-source
        Rdatatable/data.table
        rcppcore/rcpp
        futureverse/future
        cran/MASS
        r-lib/desc
        r-lib/usethis
        r-lib/roxygen2
        deepayan/lattice
        dmurdoch/rgl
        r-spatial/sf
      # Known non-actionable failures to suppress from the report. Each entry is
      # `repo|path|category`; the path is repo-relative, as the corpus report
      # keys it. Only the *named* category is suppressed -- if the same file
      # starts failing a different way (losslessness, a panic), that failure is
      # still recorded, so the allowlist can never mask a new regression. Drop
      # an entry the moment arity handles the file: it then simply passes and
      # records nothing, and a stale entry is the one way this list *can* hide a
      # real bug.
      #
      # The bar is *not valid R*, not merely *unfixed*: R itself rejects the
      # file (check with `R --vanilla -q -e 'parse("<file>")'`), or it is not R
      # at all (a template carrying placeholder syntax, generated output
      # committed by mistake). A real modeling gap we have not fixed yet does
      # **not** belong here -- allowlisting it buries the work; leave it failing
      # and record it in TODO.md instead. Group entries under a comment naming
      # the root cause and the issue.
      ALLOWLIST: |
        # (empty)
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clone corpus and run smoke test
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="$RUNNER_TEMP/arity-corpus-scan"
          CORPUS_DIR="$RUNNER_TEMP/arity-corpus-repos"
          mkdir -p "$RESULTS_DIR" "$CORPUS_DIR"

          MANIFEST="$RESULTS_DIR/manifest.tsv"
          RAW="$RESULTS_DIR/raw_failures.tsv"
          FAILURES_TSV="$RESULTS_DIR/failures.tsv"

          ARITY_SHA="$(git rev-parse HEAD)"
          ARITY_VERSION="$(awk -F '"' '/^version = /{print $2; exit}' Cargo.toml)"

          # Clone each repo, recording (dir_name, repo, sha).
          : > "$MANIFEST"
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            dir_name="${repo//\//__}"
            git clone --depth 1 "https://github.com/${repo}.git" "$CORPUS_DIR/$dir_name"
            sha="$(git -C "$CORPUS_DIR/$dir_name" rev-parse HEAD)"
            printf '%s\t%s\t%s\n' "$dir_name" "$repo" "$sha" >> "$MANIFEST"
          done <<< "$TARGET_REPOS"

          # Run the smoke test in CI mode: it writes a failure report and exits 0
          # even on regressions, so this step stays green and the issue job runs.
          # Keep the run log (totals, including how many files were skipped as
          # unparseable) in the artifact -- a shift in the skipped count is what
          # tells triage that files moved between buckets.
          ARITY_CORPUS="$CORPUS_DIR" ARITY_CORPUS_REPORT="$RAW" \
            cargo test --release --test corpus -- --ignored --nocapture \
            2>&1 | tee "$RESULTS_DIR/corpus.log"

          # Normalize the allowlist into exact `repo|path|category` lines
          # (dropping blank and `#` comment lines). A failure whose key matches
          # one of these is suppressed from the report; see `ALLOWLIST` above.
          ALLOWLIST_ENTRIES="$(printf '%s\n' "${ALLOWLIST:-}" \
            | sed 's/[[:space:]]*$//' | grep -Ev '^[[:space:]]*(#|$)' || true)"
          SUPPRESSED_COUNT=0

          is_allowlisted() {
            # args: repo file category
            [ -n "$ALLOWLIST_ENTRIES" ] || return 1
            grep -Fxq "$1|$2|$3" <<< "$ALLOWLIST_ENTRIES"
          }

          # Enrich the raw report (relative-key \t category \t message) with the
          # repo/sha each file came from, for issue creation.
          printf 'repo\tfailure_type\tfile\tdetail\trepo_sha\tarity_sha\tarity_version\n' > "$FAILURES_TSV"
          if [ -s "$RAW" ]; then
            declare -A REPO_OF SHA_OF
            while IFS=$'\t' read -r dir_name repo sha; do
              [ -z "$dir_name" ] && continue
              REPO_OF["$dir_name"]="$repo"
              SHA_OF["$dir_name"]="$sha"
            done < "$MANIFEST"

            while IFS=$'\t' read -r key ftype detail; do
              [ -z "$key" ] && continue
              dir_name="${key%%/*}"
              rel="${key#*/}"
              repo_name="${REPO_OF[$dir_name]:-$dir_name}"
              if is_allowlisted "$repo_name" "$rel" "$ftype"; then
                echo "notice: allowlisted $ftype for $repo_name:$rel (record-only)"
                SUPPRESSED_COUNT=$((SUPPRESSED_COUNT + 1))
                continue
              fi
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$repo_name" \
                "$ftype" \
                "$rel" \
                "$detail" \
                "${SHA_OF[$dir_name]:-}" \
                "$ARITY_SHA" \
                "$ARITY_VERSION" \
                >> "$FAILURES_TSV"
            done < "$RAW"
          fi

          # Hand the suppressed tally to the summarize step (separate shells
          # share only the results dir, which is also the uploaded artifact).
          echo "$SUPPRESSED_COUNT" > "$RESULTS_DIR/suppressed_count"

      - name: Summarize scan results
        id: summarize
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="$RUNNER_TEMP/arity-corpus-scan"
          FAILURES_TSV="$RESULTS_DIR/failures.tsv"
          failure_count="$(($(wc -l < "$FAILURES_TSV") - 1))"
          [ "$failure_count" -lt 0 ] && failure_count=0
          suppressed_count=0
          [ -f "$RESULTS_DIR/suppressed_count" ] && \
            suppressed_count="$(cat "$RESULTS_DIR/suppressed_count")"

          echo "failure_count=$failure_count" >> "$GITHUB_OUTPUT"
          {
            echo "### Arity corpus smoke test"
            echo ""
            echo "- Failure records: $failure_count"
            echo "- Suppressed (allowlisted, record-only): $suppressed_count"
            if [ -f "$RESULTS_DIR/corpus.log" ]; then
              totals="$(grep -E '^corpus: [0-9]+ files' "$RESULTS_DIR/corpus.log" | tail -n 1 || true)"
              [ -n "$totals" ] && echo "- Totals: ${totals#corpus: }"
            fi
            if [ "$failure_count" -gt 0 ]; then
              echo ""
              echo "| repo | category | file | detail |"
              echo "| --- | --- | --- | --- |"
              tail -n +2 "$FAILURES_TSV" \
                | awk -F '\t' '{printf "| %s | %s | `%s` | %s |\n", $1, $2, $3, ($4 == "" ? "" : "`" $4 "`")}'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan results artifact
        uses: actions/upload-artifact@v7
        with:
          name: corpus-scan-results
          path: ${{ runner.temp }}/arity-corpus-scan
          if-no-files-found: error

  corpus-issues:
    name: Track Regression Issues
    needs: corpus-scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Download scan results artifact
        uses: actions/download-artifact@v8
        with:
          name: corpus-scan-results
          path: ${{ runner.temp }}/arity-corpus-scan

      - name: Create or update regression issues
        if: needs.corpus-scan.outputs.failure_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FAILURES_TSV="$RUNNER_TEMP/arity-corpus-scan/failures.tsv"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing_labels="$(gh label list --repo "$GITHUB_REPOSITORY" --limit 500 --json name --jq '.[].name')"

          has_label() { grep -Fxq "$1" <<< "$existing_labels"; }
          ensure_label() {
            local name="$1" color="$2" desc="$3"
            has_label "$name" && return 0
            if gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$desc" >/dev/null 2>&1; then
              existing_labels+=$'\n'"$name"
            else
              echo "warning: could not create label '$name'"
            fi
          }

          # One issue per (repo, failure_type) pair.
          tail -n +2 "$FAILURES_TSV" | awk -F '\t' '{print $1 "\t" $2}' | sort -u \
          | while IFS=$'\t' read -r repo failure_type; do
            [ -z "$repo" ] || [ -z "$failure_type" ] && continue

            marker="arity-corpus-key:repo=${repo};type=${failure_type}"
            title="CI: corpus regression in ${repo} (${failure_type})"
            count="$(awk -F '\t' -v r="$repo" -v t="$failure_type" '$1==r && $2==t {c++} END{print c+0}' "$FAILURES_TSV")"
            samples="$(awk -F '\t' -v r="$repo" -v t="$failure_type" '$1==r && $2==t {printf "- `%s`\n", $3; c++; if (c==10) exit}' "$FAILURES_TSV")"
            sample_file="$(awk -F '\t' -v r="$repo" -v t="$failure_type" '$1==r && $2==t {print $3; exit}' "$FAILURES_TSV")"
            # Distinct error messages with counts: for format-error and panic
            # this is the actual classifier, and the fastest route to a root
            # cause without cloning anything.
            details="$(awk -F '\t' -v r="$repo" -v t="$failure_type" '$1==r && $2==t && $4!="" {print $4}' "$FAILURES_TSV" \
              | sort | uniq -c | sort -rn | head -n 10 \
              | awk '{c=$1; $1=""; sub(/^ /, ""); printf "- %s× `%s`\n", c, $0}')"
            repo_sha="$(awk -F '\t' -v r="$repo" -v t="$failure_type" '$1==r && $2==t {print $5; exit}' "$FAILURES_TSV")"
            arity_sha="$(awk -F '\t' -v r="$repo" -v t="$failure_type" '$1==r && $2==t {print $6; exit}' "$FAILURES_TSV")"
            arity_version="$(awk -F '\t' -v r="$repo" -v t="$failure_type" '$1==r && $2==t {print $7; exit}' "$FAILURES_TSV")"

            body_file="$RUNNER_TEMP/issue-body.md"
            {
              echo "<!-- $marker -->"
              echo "# Corpus smoke-test regression"
              echo ""
              echo "- Target repository: \`$repo\`"
              echo "- Failure category: \`$failure_type\`"
              echo "- Failure records in this run: $count"
              echo "- Workflow run: $RUN_URL"
              [ -n "$repo_sha" ] && echo "- Target repository commit: \`$repo_sha\`"
              [ -n "$arity_version" ] && echo "- Arity version: \`$arity_version\`"
              [ -n "$arity_sha" ] && echo "- Arity commit: \`$arity_sha\`"
              echo ""
              echo "Sample files:"
              echo "$samples"
              if [ -n "$details" ]; then
                echo ""
                echo "Most common details:"
                echo "$details"
              fi
              echo ""
              echo "Reproduce locally (run from an arity checkout):"
              echo ""
              echo '```bash'
              echo "git clone https://github.com/$repo.git /tmp/target"
              echo "git -C /tmp/target checkout ${repo_sha:-HEAD}"
              echo ""
              echo "# this file"
              case "$failure_type" in
                losslessness) echo "cargo run --release -- parse --verify --quiet \"/tmp/target/$sample_file\"" ;;
                idempotence) echo "cargo run --release -- format --verify \"/tmp/target/$sample_file\"" ;;
                # Every DESCRIPTION category reproduces the same way: format the
                # one file and look at what came back.
                dcf-*) echo "cargo run --release -- format --verify \"/tmp/target/$sample_file\"" ;;
                *) echo "cargo run --release -- format < \"/tmp/target/$sample_file\" > /dev/null" ;;
              esac
              echo ""
              echo "# the whole bucket (the actual triage unit)"
              echo "ARITY_CORPUS=/tmp/target ARITY_CORPUS_REPORT=/tmp/failures.tsv \\"
              echo "  cargo test --release --test corpus -- --ignored --nocapture"
              echo '```'
              echo ""
              echo "See the \`corpus-scan-results\` artifact for the full failure list"
              echo "and the run log. Triage with the \`smoke-test-triage\` skill."
            } > "$body_file"

            export ISSUE_TITLE="$title"
            issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
              --json number,title --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)"

            if [ -n "$issue_number" ]; then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            else
              ensure_label "ci" "0366D6" "Continuous integration"
              ensure_label "smoke-test" "5319E7" "Corpus smoke-test regressions"
              case "$failure_type" in
                idempotence) color="B60205" ;;
                losslessness) color="D93F0B" ;;
                format-error) color="FBCA04" ;;
                panic) color="E11D21" ;;
                dcf-idempotence) color="B60205" ;;
                dcf-losslessness) color="D93F0B" ;;
                dcf-format-error) color="FBCA04" ;;
                dcf-meaning) color="7057FF" ;;
                dcf-comment-loss) color="7057FF" ;;
                dcf-panic) color="E11D21" ;;
                *) color="6E7781" ;;
              esac
              ensure_label "$failure_type" "$color" "Corpus smoke-test failure category"

              label_args=()
              for label in "ci" "smoke-test" "$failure_type"; do
                has_label "$label" && label_args+=(--label "$label")
              done

              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                "${label_args[@]}" --body-file "$body_file"
            fi
          done

      - name: Comment on issues that no longer reproduce
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FAILURES_TSV="$RUNNER_TEMP/arity-corpus-scan/failures.tsv"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Markers that DID fail this run (skip these — handled above).
          current_keys="$RUNNER_TEMP/current-keys.txt"
          : > "$current_keys"
          if [ -f "$FAILURES_TSV" ]; then
            tail -n +2 "$FAILURES_TSV" \
              | awk -F '\t' 'NF>=2 && $1!="" && $2!="" {printf "arity-corpus-key:repo=%s;type=%s\n", $1, $2}' \
              | sort -u > "$current_keys"
          fi

          open_issues_json="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:body "arity-corpus-key:"' --limit 500 --json number,body)"

          echo "$open_issues_json" | jq -c '.[]' | while IFS= read -r issue; do
            number="$(jq -r '.number' <<< "$issue")"
            body="$(jq -r '.body' <<< "$issue")"
            marker="$(grep -Eo 'arity-corpus-key:repo=[^;]+;type=[^[:space:]<>]+' <<< "$body" | head -n 1 || true)"
            [ -z "$marker" ] && continue
            grep -Fxq "$marker" "$current_keys" && continue

            # Don't repeat a green note if the last comment already is one.
            latest="$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq '.comments | last | .body // ""')"
            grep -Fq 'No longer reproducing' <<< "$latest" && continue

            comment_file="$RUNNER_TEMP/green-comment.md"
            {
              echo "No longer reproducing in the latest scan."
              echo ""
              echo "- Marker: \`$marker\`"
              echo "- Workflow run: $RUN_URL"
              echo ""
              echo "If this stays green over the next few weekly scans, this issue can be closed."
            } > "$comment_file"
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$comment_file"
          done

      - name: Fail workflow when regressions are detected
        if: needs.corpus-scan.outputs.failure_count != '0'
        shell: bash
        run: |
          echo "Corpus smoke-test regressions detected: ${{ needs.corpus-scan.outputs.failure_count }}"
          exit 1
