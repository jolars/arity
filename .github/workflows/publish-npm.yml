name: Publish npm

# Publishes the unscoped `arity-cli` package and the eight `@arity-cli/<platform>`
# binary packages with OIDC provenance. Each package's name must already exist
# and have a trusted publisher configured before CI can publish it—so adding a
# new target requires a one-time manual `npm publish` of a placeholder first.
#
# Release binaries are built once by `packages.yml`. After those assets are
# complete, `build-and-test.yml` dispatches this workflow at the Versionary tag.
# The npm packages therefore contain the exact GitHub release binaries.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose binaries should be published"
        required: true
        type: string
      dry_run:
        description: "Assemble packages but do not publish"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate requested release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != v* ]]; then
            echo "::error::npm packages can only be published for a primary v* release"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish-platform-packages:
    name: Publish @arity-cli/${{ matrix.npm_name }}
    needs: validate-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            npm_name: linux-x64-gnu
            os: linux
            cpu: x64
            libc: glibc
            binary: arity
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            npm_name: linux-arm64-gnu
            os: linux
            cpu: arm64
            libc: glibc
            binary: arity
            archive_ext: tar.gz
          - target: x86_64-unknown-linux-musl
            npm_name: linux-x64-musl
            os: linux
            cpu: x64
            libc: musl
            binary: arity
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-musl
            npm_name: linux-arm64-musl
            os: linux
            cpu: arm64
            libc: musl
            binary: arity
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            npm_name: darwin-x64
            os: darwin
            cpu: x64
            binary: arity
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            npm_name: darwin-arm64
            os: darwin
            cpu: arm64
            binary: arity
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            npm_name: win32-x64
            os: win32
            cpu: x64
            binary: arity.exe
            archive_ext: zip
          - target: aarch64-pc-windows-msvc
            npm_name: win32-arm64
            os: win32
            cpu: arm64
            binary: arity.exe
            archive_ext: zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download release binary
        env:
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BINARY: ${{ matrix.binary }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="arity-$TARGET.$ARCHIVE_EXT"
          mkdir release binary
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --pattern "$asset.sha256" --dir release
          (cd release && sha256sum --check "$asset.sha256")

          if [ "$ARCHIVE_EXT" = zip ]; then
            unzip -j "release/$asset" "$BINARY" -d binary
          else
            tar -xzf "release/$asset" -C binary "./$BINARY"
          fi
          test -f "binary/$BINARY"

      - name: Read package version
        id: version
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/arity-cli/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::npm version $version does not match release tag $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Assemble package
        run: |
          set -euo pipefail
          pkg_dir=staging/${{ matrix.npm_name }}
          mkdir -p "$pkg_dir"
          cp npm/platform-template/package.json "$pkg_dir/package.json"
          cp npm/platform-template/README.md "$pkg_dir/README.md"
          cp LICENSE "$pkg_dir/LICENSE"
          cp binary/${{ matrix.binary }} "$pkg_dir/${{ matrix.binary }}"
          chmod +x "$pkg_dir/${{ matrix.binary }}"

          node -e '
            const fs = require("node:fs");
            const path = process.argv[1];
            const repl = {
              __NAME__: process.env.NPM_NAME,
              __VERSION__: process.env.PKG_VERSION,
              __OS__: process.env.PKG_OS,
              __CPU__: process.env.PKG_CPU,
              __BINARY__: process.env.BINARY,
            };
            let json = JSON.parse(fs.readFileSync(path, "utf8"));
            const subst = (v) => typeof v === "string"
              ? v.replace(/__[A-Z]+__/g, (m) => repl[m] ?? m)
              : Array.isArray(v) ? v.map(subst)
              : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, subst(x)]))
              : v;
            json = subst(json);
            if (process.env.PKG_LIBC) json.libc = [process.env.PKG_LIBC];
            else delete json.libc;
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + "\n");
          ' "$pkg_dir/package.json"

          # Substitute __NAME__ in README.
          sed -i "s|__NAME__|${{ matrix.npm_name }}|g" "$pkg_dir/README.md"

          echo "--- package.json ---"
          cat "$pkg_dir/package.json"
        env:
          NPM_NAME: ${{ matrix.npm_name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_OS: ${{ matrix.os }}
          PKG_CPU: ${{ matrix.cpu }}
          PKG_LIBC: ${{ matrix.libc }}
          BINARY: ${{ matrix.binary }}

      - name: Publish to npm
        working-directory: staging/${{ matrix.npm_name }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi

  publish-main:
    name: Publish arity-cli
    needs: [validate-release, publish-platform-packages]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify package version
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./npm/arity-cli/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::npm version $version does not match release tag $TAG"
            exit 1
          fi

      - name: Assemble main package
        run: |
          set -euo pipefail
          pkg_dir=staging/arity-cli
          mkdir -p "$pkg_dir/bin"
          cp npm/arity-cli/package.json "$pkg_dir/package.json"
          cp npm/arity-cli/README.md "$pkg_dir/README.md"
          cp npm/arity-cli/bin/arity.js "$pkg_dir/bin/arity.js"
          cp LICENSE "$pkg_dir/LICENSE"

          echo "--- package.json ---"
          cat "$pkg_dir/package.json"

      - name: Publish to npm
        working-directory: staging/arity-cli
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
