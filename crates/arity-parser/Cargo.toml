[package]
name = "arity-parser"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Lossless CST parser, typed AST wrappers, and incremental reparser for the R language"
license.workspace = true
repository.workspace = true
homepage = "https://arity.cc"
documentation = "https://docs.rs/arity-parser"
authors.workspace = true
include = ["/src/**/*", "/README.md", "/CHANGELOG.md"]
keywords = ["r", "parser", "cst", "incremental"]
categories = ["parsing", "parser-implementations", "text-processing"]

[dependencies]
rowan = "0.17.0"
serde = { version = "1.0.229", features = ["derive"] }
smol_str = { version = "0.3.6", features = ["serde"] }

[dev-dependencies]
insta = "1.48.0"
serde_json = "1.0.151"
air_r_parser = { git = "https://github.com/posit-dev/air", rev = "4cbd36d552e27d8930cff1602d56bfd9ce4c1ed1" }
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "parse"
harness = false
