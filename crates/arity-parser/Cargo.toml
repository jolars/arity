[package]
name = "arity-parser"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Lossless CST parser, typed AST wrappers, and incremental reparser for the R language"
license.workspace = true
repository.workspace = true
homepage = "https://arity.cc"
documentation = "https://docs.rs/arity-parser"
authors.workspace = true
include = ["/src/**/*", "/README.md", "/CHANGELOG.md"]
keywords = ["r", "parser", "cst", "incremental"]
categories = ["parsing", "parser-implementations", "text-processing"]

[dependencies]
rowan = "0.16.1"
serde = { version = "1.0.228", features = ["derive"] }
smol_str = { version = "0.3.2", features = ["serde"] }
