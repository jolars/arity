# Recorded intentional deviations from `air`'s output.
#
# This file is the "documented deviations" list behind the soft air-compatibility
# gauge (see `tests/air_compat.rs` and `AIR_COMPAT.md`). It is SUBORDINATE to
# Tenet 1 (deterministic, rule-based formatting): listing a file here means
# "arity diverges from air here ON PURPOSE", not "air is wrong to flag it".
#
# Anything that diverges from air and is NOT listed here is reported as an
# UNEXPLAINED divergence --- the triage queue. Adding an entry is how you resolve
# that tension in favor of keeping arity's own rule (the alternative being to fix
# arity to match air, when air's output is the more idiomatic one).
#
# Key   = corpus file identifier:
#           - default corpus: the fixture directory name (e.g. `air_call`)
#           - custom corpus:  the path relative to `AIR_COMPAT_CORPUS`
# Value = a short rationale for the deviation.
#
# NOTE: keying by whole file is coarse --- a fixture may mix an intentional
# deviation with a genuine bug. Only list a file when ALL of its divergence is
# deliberate; otherwise leave it unexplained so the bug stays visible.

[deviations]
# Unbreakable-atom hug: when a call's only leading argument is a bare atom too
# wide to fit on any line, breaking the list buys no width (the atom overflows
# its own exploded line too) --- only lines and indentation. Arity keeps the
# trailing `{` hug rather than exploding (`with(<82-char symbol>, {`). Air
# expands here. This is the same uniform, callee-agnostic rule that keeps
# `test_that("<long>", {`…`})` compact (which now MATCHES air's `test_that`
# special case as a side effect, so `air_test_that` is no longer a deviation).
# See TODO.md and the `air_test_that` fixture.
air_call = "unbreakable-atom hug: arity keeps `with(<over-width symbol>, {` compact; air expands"
call_trailing_braced_expression = "unbreakable-atom hug: arity keeps `with(<over-width symbol>, {` compact; air expands"

# Comments stay inside their parentheses. `(` … `)` is treated like any other
# delimited group: an own-line comment in the body keeps the group broken, with
# the comment where the author put it. Air instead hoists such a comment out of
# the parens (`x <- (\n  a\n  # note\n)` becomes `x <- (a)` plus a following
# top-level comment), which relocates it past the end of the statement --- and
# air does not do this for the identical shape in a call argument list, which it
# keeps inside. Arity applies the one rule to both.
paren_own_line_comment = "own-line comment stays inside the parens; air hoists it out of the statement"

# Adjacent trailing comments align at the longest code prefix when the run fits
# within `line-width`. Air keeps one separating space in these cases; Arity uses
# the rustfmt-style alignment rule pinned by the dedicated fixture.
air_braced_expressions = "arity aligns adjacent trailing comments; air keeps one separating space"
braced_empty_loops = "arity aligns adjacent trailing comments; air keeps one separating space"
call_arg_comment_before_unary = "arity aligns adjacent trailing comments; air keeps one separating space"
comment_trailing_alignment = "arity aligns adjacent trailing comments; air keeps one separating space"

# Format directives are Arity's explicit byte-preservation contract. Air does
# not recognize them and formats the protected statement, region, or file. The
# resulting divergence is therefore the intended effect of each fixture.
directive_skip_file = "arity's `skip-file` preserves the file byte-for-byte; air does not honor the directive"
directive_region_unclosed = "arity's unclosed `off` region preserves through EOF; air does not honor the directive"
directive_skip_control_flow_body = "arity's `skip` preserves the braceless body byte-for-byte; air does not honor the directive"
directive_both_prefix = "arity's short `arity skip` form preserves the statement; air does not honor the directive"
directive_skip_statement = "arity's `skip` preserves the hand-aligned statement; air does not honor the directive"
directive_skip_in_block = "arity's `skip` preserves the indented block statement; air does not honor the directive"
directive_region = "arity's `off` region preserves its contents byte-for-byte; air does not honor the directive"

# Arity preserves the assignment operator written by the user. Air canonicalizes
# `=` assignments to `<-`; that rewrite is outside a layout-only formatter's
# remit and is not valid as a context-free token substitution in R.
assignment_rhs_if_else_comment = "arity preserves `=` assignment; air rewrites it to `<-`"
subset2_assign_if_else_rhs = "arity preserves `=` assignment; air rewrites it to `<-`"
air_pipelines = "arity preserves `=` assignment; air rewrites it to `<-`"

# Assignment itself introduces no width-driven break. Its RHS binary chain
# chooses its layout from its own start column, keeping the first complete
# multiplication together; air breaks that multiplication after `*` to account
# for the long subset-assignment LHS. These fixtures pin the Arity behavior as a
# regression guard against unnecessarily exploding `[[` expressions.
assignment_rhs_breaks_before_lhs_subset_bare_body = "assignment adds no break of its own; arity keeps the first RHS multiplication together"
assignment_rhs_breaks_before_lhs_subset_in_function = "assignment adds no break of its own; arity keeps the first RHS multiplication together"

# Table layout is all-or-nothing, and its rows come from the header count. Air
# tables every `tribble()` unconditionally, splitting rows wherever the author
# happened to break lines, so it lays out as a "table" a call that is not one:
# a ragged cell count, a hole, a named argument, or dynamic dots all still get
# padded into columns. Air also relocates a comment out of the nested call it
# belongs to in the process (`c(\n  1, # first\n  2\n)` becomes
# `c(1, 2) # first`). Arity declines the table for exactly those shapes and
# keeps the ordinary call layout, which is what these two fixtures pin. The
# fixtures where the cells *do* form a table match air byte for byte.
tribble_table_fallback = "arity declines table layout when the cells do not form complete rows; air tables every `tribble()`"
tribble_table_comments = "arity keeps comment relocation out of table layout; air tables the call and moves the comment"
