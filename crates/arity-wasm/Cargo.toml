[package]
name = "arity-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Browser bindings for the Arity playground"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arity-formatter = { path = "../arity-formatter" }
arity-parser = { path = "../arity-parser" }
wasm-bindgen = "0.2.129"

# The bundled wasm-opt executable cannot run on NixOS.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
