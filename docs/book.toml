[book]
title = "Arity"
description = "Arity is a language server, formatter, and linter for R."
authors = ["Johan Larsson"]
language = "en"
src = "src"

[output.html]
site-url = "https://arity.cc/"
git-repository-url = "https://github.com/jolars/arity"
edit-url-template = "https://github.com/jolars/arity/edit/main/docs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/arity.css", "theme/bench-charts.css"]
additional-js = [
    "theme/vendor/vega.min.js",
    "theme/vendor/vega-lite.min.js",
    "theme/vendor/vega-embed.min.js",
    "theme/bench-charts.js",
]

[output.html.search]
enable = true

# The benchmark page moved into the guide and was renamed; keep the published
# URL working.
[output.html.redirect]
"/reference/benchmarks.html" = "../guide/performance.html"
