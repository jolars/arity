# Arity formatter / linter configuration.
# All values shown below are the built-in defaults; this file dogfoods the
# configuration discovery path and serves as a reference.

# Test fixtures are inputs, not sources. Several are complete miniature R
# packages, so `format .` would otherwise walk in and rewrite the very files the
# parser and oracle suites assert on byte for byte.
extend-exclude = ["tests/fixtures/"]

[format]
line-width = 80
indent-width = 2
description = true

[lint]
