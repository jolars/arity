flavor = "gfm"

extend-exclude = [
  "TODO.md",
  "AGENTS.md",
  "CHANGELOG.md",
  "AIR_COMPAT.md",
  # Generated mdBook pages (clap reference + rule reference + benchmark
  # partials); not hand-written prose.
  "docs/src/reference/cli.md",
  "docs/src/reference/rules.md",
  "docs/src/guide/benchmarks_meta.md",
  "docs/src/guide/benchmarks_results.md",
  "docs/src/version.md",
  # mdBook's SUMMARY.md is structural (one chapter per line); prose reflow breaks it.
  "docs/src/SUMMARY.md",
  ".claude/**/*",
  ".github/**/*",
]
